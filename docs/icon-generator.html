<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Icon Generator — Asymmetric Matrix</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #2a2a2a; color: #ccc; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; gap: 32px; }
  h2 { color: #FAF9F5; margin: 0; }
  .row { display: flex; gap: 48px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .card label { font-size: 12px; color: #888; letter-spacing: 1px; text-transform: uppercase; }
  canvas { border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.5); }
  button {
    background: #C96442; color: #fff; border: none; border-radius: 6px;
    padding: 8px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: 'Segoe UI', sans-serif;
  }
  button:hover { background: #B05730; }
  .note { font-size: 11px; color: #666; text-align: center; max-width: 500px; }
</style>
</head>
<body>

<h2>Asymmetric Matrix — Icon Generator</h2>

<div class="row">
  <div class="card">
    <label>300 × 300 px</label>
    <canvas id="c300" width="300" height="300"></canvas>
    <button onclick="download('c300','icon-300x300.png')">⬇ Download 300×300</button>
  </div>
  <div class="card">
    <label>36 × 36 px</label>
    <canvas id="c36" width="36" height="36" style="image-rendering:pixelated;width:144px;height:144px;border-radius:6px"></canvas>
    <button onclick="download('c36','icon-36x36.png')">⬇ Download 36×36</button>
  </div>
  <div class="card">
    <label>20 × 20 px</label>
    <canvas id="c20" width="20" height="20" style="image-rendering:pixelated;width:120px;height:120px;border-radius:4px"></canvas>
    <button onclick="download('c20','icon-20x20.png')">⬇ Download 20×20</button>
  </div>
</div>

<p class="note">
  Save <strong>icon-300x300.png</strong> as the AppSource listing image.<br>
  Copy <strong>icon-20x20.png</strong> (or 36×36) to <code>assets/icon.png</code> in the project folder.
</p>

<script>
function drawIcon(canvas, size) {
  const ctx = canvas.getContext('2d');
  const s = size;
  const pad = s * 0.08;
  const r = s * 0.18; // corner radius

  // ── Background gradient (top-left dark → bottom-right slightly lighter)
  const bgGrad = ctx.createLinearGradient(0, 0, s, s);
  bgGrad.addColorStop(0, '#2A2820');
  bgGrad.addColorStop(1, '#3D3929');
  roundRect(ctx, 0, 0, s, s, r, bgGrad);

  // ── Main gradient (orange → purple, used for lines and dots)
  function makeGrad(x0, y0, x1, y1) {
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0,    '#B05730');
    g.addColorStop(0.55, '#C96442');
    g.addColorStop(1,    '#9C87F5');
    return g;
  }

  const inner = s - pad * 2;

  // ── Plot area
  const px = pad, py = pad, pw = inner, ph = inner;
  const yRef = py + ph * 0.42; // horizontal reference line (slightly above center)

  // Zone backgrounds (subtle)
  const zoneAlpha = 0.18;
  // Upper: 3 zones
  const uw = pw / 3;
  const zColors = ['#4A7FA8','#8A7A4A','#4A8A6A'];
  for (let i = 0; i < 3; i++) {
    ctx.globalAlpha = zoneAlpha;
    ctx.fillStyle = zColors[i];
    ctx.fillRect(px + uw * i, py, uw, yRef - py);
    ctx.globalAlpha = 1;
  }
  // Lower: 2 zones
  const lh = (py + ph) - yRef;
  const lw = pw / 2;
  ctx.globalAlpha = zoneAlpha;
  ctx.fillStyle = '#7A4A8A'; ctx.fillRect(px,      yRef, lw, lh);
  ctx.fillStyle = '#4A5A8A'; ctx.fillRect(px + lw, yRef, lw, lh);
  ctx.globalAlpha = 1;

  // ── Y-reference line (orange)
  ctx.strokeStyle = '#C96442';
  ctx.lineWidth   = Math.max(1, s * 0.018);
  ctx.setLineDash([s * 0.04, s * 0.025]);
  ctx.beginPath();
  ctx.moveTo(px, yRef);
  ctx.lineTo(px + pw, yRef);
  ctx.stroke();
  ctx.setLineDash([]);

  // ── Upper vertical dividers (2 lines → 3 zones)
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth   = Math.max(0.5, s * 0.01);
  ctx.setLineDash([s * 0.03, s * 0.02]);
  [1/3, 2/3].forEach(t => {
    ctx.beginPath();
    ctx.moveTo(px + pw * t, py);
    ctx.lineTo(px + pw * t, yRef);
    ctx.stroke();
  });

  // ── Lower vertical divider (1 line → 2 zones) — in purple
  ctx.strokeStyle = '#9C87F5';
  ctx.lineWidth   = Math.max(0.5, s * 0.012);
  ctx.setLineDash([s * 0.03, s * 0.02]);
  ctx.beginPath();
  ctx.moveTo(px + pw * 0.5, yRef);
  ctx.lineTo(px + pw * 0.5, py + ph);
  ctx.stroke();
  ctx.setLineDash([]);

  // ── Data points
  const pts = [
    // upper zones
    { x: 0.13, y: 0.15, r: 0.055, c: '#C96442' },
    { x: 0.28, y: 0.30, r: 0.038, c: '#E8A080' },
    { x: 0.50, y: 0.12, r: 0.045, c: '#FAF9F5' },
    { x: 0.62, y: 0.28, r: 0.032, c: '#9C87F5' },
    { x: 0.80, y: 0.18, r: 0.055, c: '#C96442' },
    { x: 0.88, y: 0.32, r: 0.030, c: '#FAF9F5' },
    // lower zones
    { x: 0.22, y: 0.68, r: 0.042, c: '#9C87F5' },
    { x: 0.38, y: 0.82, r: 0.035, c: '#FAF9F5' },
    { x: 0.72, y: 0.62, r: 0.048, c: '#C96442' },
    { x: 0.85, y: 0.78, r: 0.030, c: '#E8A080' },
  ];

  pts.forEach(p => {
    const cx = px + pw * p.x;
    const cy = py + ph * p.y;
    const rad = s * p.r;
    ctx.beginPath();
    ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fillStyle = p.c;
    ctx.globalAlpha = 0.9;
    ctx.fill();
    ctx.globalAlpha = 1;
    // white ring
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = Math.max(0.5, s * 0.008);
    ctx.stroke();
  });

  // ── Outer border (gradient stroke)
  ctx.save();
  const borderGrad = makeGrad(0, s, s, 0);
  ctx.strokeStyle = borderGrad;
  ctx.lineWidth = Math.max(1, s * 0.022);
  roundRectStroke(ctx, s * 0.015, s * 0.015, s - s * 0.03, s - s * 0.03, r * 0.85);
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}

function roundRectStroke(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.stroke();
}

function download(canvasId, filename) {
  const canvas = document.getElementById(canvasId);
  const a = document.createElement('a');
  a.download = filename;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

// Draw all sizes
drawIcon(document.getElementById('c300'), 300);
drawIcon(document.getElementById('c36'),   36);
drawIcon(document.getElementById('c20'),   20);
</script>
</body>
</html>
